<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR Spatial 3D - Zero Lag</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; perspective: 1200px; }

        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
        }

        /* Cena com Profundidade 3D Real */
        .scene-3d {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
            transform-style: preserve-3d;
        }

        #floating-panel {
            position: absolute;
            width: 350px;
            height: 480px;
            background: rgba(12, 12, 20, 0.94);
            border: 2px solid rgba(56, 189, 248, 0.8);
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.3);
            display: flex; flex-direction: column; overflow: hidden;
            pointer-events: auto;
            touch-action: none;
            transform-style: preserve-3d;
            will-change: transform;
            transform: translate3d(0px, 0px, 0px) rotateX(0deg) rotateY(0deg);
        }

        .panel-header {
            height: 50px;
            background: rgba(56, 189, 248, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: bold; letter-spacing: 1.5px;
            cursor: grab;
        }

        .panel-body {
            flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
        }
        .card h3 { font-size: 0.95rem; color: #38bdf8; }
        .card p { font-size: 0.8rem; opacity: 0.75; line-height: 1.3; }

        .btn-action {
            background: #38bdf8; color: #000; border: none; padding: 12px;
            border-radius: 12px; font-weight: bold; font-size: 0.85rem; cursor: pointer; text-align: center;
        }

        #hand-cursor {
            position: absolute; width: 20px; height: 20px;
            background: #38bdf8; border: 3px solid #ffffff;
            border-radius: 50%; z-index: 100; pointer-events: none;
            transform: translate(-50%, -50%); display: none;
            box-shadow: 0 0 15px #38bdf8;
        }
        #hand-cursor.pinching {
            background: #4ade80; border-color: #fff;
            transform: translate(-50%, -50%) scale(0.6);
            box-shadow: 0 0 20px #4ade80;
        }

        #status {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; z-index: 20; color: #00ff66;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    <div id="hand-cursor"></div>

    <div class="scene-3d">
        <div id="floating-panel">
            <div class="panel-header" id="header-drag">✨ AGARRAR AQUI (PINÇA)</div>
            <div class="panel-body">
                <h2>Painel Espacial 3D</h2>
                <p>Usa o polegar e o indicador juntos na barra de cima para mover o painel pelo ar. Repara na perspetiva 3D inclinada na tua direção!</p>
                <div class="card">
                    <h3>Estado do Sistema</h3>
                    <p id="info-text">Rastreio de mão ativo com malha visual e resposta imediata.</p>
                </div>
                <button class="btn-action" onclick="alert('Ação executada com sucesso!')">Clicar com o Dedo</button>
            </div>
        </div>
    </div>

    <div id="status">A inicializar motor 3D...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('hand-cursor');
        const statusDiv = document.getElementById('status');
        const floatPanel = document.getElementById('floating-panel');
        const headerDrag = document.getElementById('header-drag');

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;

        let panelX = (window.innerWidth - 350) / 2;
        let panelY = (window.innerHeight - 480) / 2;
        
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(0deg) rotateY(0deg)`;

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDiv.innerText = "Mão Detetada [3D & Zero Lag] 🟢";
                cursor.style.display = 'block';

                const landmarks = results.multiHandLandmarks[0];

                // Desenhar a malha visual bonita na mão
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(56, 189, 248, 0.5)', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#38bdf8', lineWidth: 1, radius: 3});

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                const targetX = indexTip.x * window.innerWidth;
                const targetY = indexTip.y * window.innerHeight;

                // Fator de suavização de 0.85 para resposta instantânea (praticamente zero delay)
                cursorX += (targetX - cursorX) * 0.85;
                cursorY += (targetY - cursorY) * 0.85;

                cursor.style.left = `${cursorX}px`;
                cursor.style.top = `${cursorY}px`;

                // Cálculo da rotação 3D real com base na posição do cursor em relação ao centro do ecrã
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const tiltY = ((cursorX - centerX) / centerX) * 15; // Rotação Y
                const tiltX = -((cursorY - centerY) / centerY) * 15; // Rotação X

                const pinchDist = Math.hypot(
                    (thumbTip.x - indexTip.x) * window.innerWidth,
                    (thumbTip.y - indexTip.y) * window.innerHeight
                );

                const headerRect = headerDrag.getBoundingClientRect();
                const isOverHeader = (
                    cursorX >= headerRect.left && cursorX <= headerRect.right &&
                    cursorY >= headerRect.top && cursorY <= headerRect.bottom
                );

                if (pinchDist < 38) {
                    cursor.classList.add('pinching');
                    if (isOverHeader || isDragging) {
                        if (!isDragging) {
                            isDragging = true;
                            dragOffsetX = cursorX - panelX;
                            dragOffsetY = cursorY - panelY;
                        }
                        panelX = cursorX - dragOffsetX;
                        panelY = cursorY - dragOffsetY;
                    }
                } else {
                    cursor.classList.remove('pinching');
                    isDragging = false;
                }

                // Aplicar translação 3D e rotação espacial real em simultâneo
                floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

            } else {
                statusDiv.innerText = "Procurando mão no enquadramento... ✋";
                cursor.style.display = 'none';
                isDragging = false;
                // Voltar à posição neutra em 3D quando tira a mão
                floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(0deg) rotateY(0deg)`;
            }

            canvasCtx.restore();
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480,
            facingMode: 'environment'
        });

        camera.start().catch(err => {
            statusDiv.innerText = "Erro ao carregar câmara!";
            console.error(err);
        });
    </script>
</body>
</html>
