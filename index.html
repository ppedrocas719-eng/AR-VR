<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR Zero Delay</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; color: #fff; }

        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Janela leve sem filtros pesados para evitar lag na GPU */
        #panel {
            position: absolute;
            width: 340px;
            height: 460px;
            background: rgba(15, 15, 20, 0.92);
            border: 2px solid rgba(56, 189, 248, 0.7);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }

        .header {
            height: 48px;
            background: rgba(56, 189, 248, 0.25);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: grab;
        }

        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: #38bdf8;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            text-align: center;
            cursor: pointer;
        }

        #cursor {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #38bdf8;
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 100;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            box-shadow: 0 0 12px #38bdf8;
        }

        #cursor.pinching {
            background: #4ade80;
            transform: translate(-50%, -50%) scale(0.65);
        }

        #status {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            z-index: 20;
            color: #00ff66;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="cursor"></div>
    <div id="status">A inicializar motor rápido...</div>

    <div id="panel" id="panel-box">
        <div class="header" id="header">AGARRAR AQUI PARA MOVER</div>
        <div class="content">
            <h2>Painel Otimizado</h2>
            <p>Usa pinça (polegar + indicador) na barra superior para arrastar o painel pelo ecrã sem atrasos.</p>
            <button class="btn" onclick="alert('Botão funcional!')">Testar Ação</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');
        const panel = document.getElementById('panel');
        const header = document.getElementById('header');
        const status = document.getElementById('status');

        let cursorX = window.innerWidth / 2;
        let cursorY = window.innerHeight / 2;
        
        let isDragging = false;
        let offsetX = 0;
        let offsetY = 0;

        // Posicionar a janela exatamente no centro inicial
        let panelX = (window.innerWidth - 340) / 2;
        let panelY = (window.innerHeight - 460) / 2;
        panel.style.left = panelX + 'px';
        panel.style.top = panelY + 'px';

        function onResults(results) {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                status.innerText = "Mão Detetada [Zero Lag] 🟢";
                cursor.style.display = 'block';

                const landmarks = results.multiHandLandmarks[0];
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                const targetX = indexTip.x * window.innerWidth;
                const targetY = indexTip.y * window.innerHeight;

                // Fator de suavização alto (0.75) para resposta imediata sem atraso percetível
                cursorX += (targetX - cursorX) * 0.75;
                cursorY += (targetY - cursorY) * 0.75;

                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';

                const pinchDist = Math.hypot(
                    (thumbTip.x - indexTip.x) * window.innerWidth,
                    (thumbTip.y - indexTip.y) * window.innerHeight
                );

                const headerRect = header.getBoundingClientRect();
                const isOverHeader = (
                    cursorX >= headerRect.left && cursorX <= headerRect.right &&
                    cursorY >= headerRect.top && cursorY <= headerRect.bottom
                );

                if (pinchDist < 40) {
                    cursor.classList.add('pinching');
                    if (isOverHeader || isDragging) {
                        if (!isDragging) {
                            isDragging = true;
                            const pRect = panel.getBoundingClientRect();
                            offsetX = cursorX - pRect.left;
                            offsetY = cursorY - pRect.top;
                        }
                        panelX = cursorX - offsetX;
                        panelY = cursorY - offsetY;
                        panel.style.left = panelX + 'px';
                        panel.style.top = panelY + 'px';
                    }
                } else {
                    cursor.classList.remove('pinching');
                    isDragging = false;
                }
            } else {
                status.innerText = "Procurando mão no enquadramento... ✋";
                cursor.style.display = 'none';
                isDragging = false;
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0, // Complexidade mínima para máxima velocidade e zero delay
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 640,
            height: 480,
            facingMode: 'environment'
        });

        camera.start().catch(err => {
            status.innerText = "Erro ao carregar câmara!";
            console.error(err);
        });
    </script>
</body>
</html>
