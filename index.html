<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR Spatial OS - Perfect Alignment & Real Google</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; perspective: 1400px; }

        #webcam { display: none; }

        #output_canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;
        }

        .spatial-scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            z-index: 10; pointer-events: none;
            transform-style: preserve-3d;
        }

        #floating-panel {
            position: absolute;
            width: 390px;
            height: 560px;
            background: rgba(12, 12, 18, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(56, 189, 248, 0.8);
            border-radius: 32px;
            box-shadow: 0 45px 100px rgba(0,0,0,0.95), inset 0 1px 0 rgba(255,255,255,0.4);
            display: flex; flex-direction: column; overflow: hidden;
            pointer-events: auto;
            touch-action: none;
            transform-style: preserve-3d;
            will-change: transform;
            transform: translate3d(0px, 0px, 0px) rotateX(0deg) rotateY(0deg);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        #floating-panel.dragging {
            box-shadow: 0 70px 140px rgba(0,0,0,0.98), 0 0 50px rgba(56, 189, 248, 0.8);
            border-color: #38bdf8;
        }

        .panel-header {
            height: 52px;
            background: rgba(56, 189, 248, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; cursor: grab;
        }
        .panel-header:active { cursor: grabbing; }
        .panel-title { font-size: 0.82rem; font-weight: 700; letter-spacing: 1.5px; }
        .drag-bar { width: 50px; height: 5px; background: rgba(255,255,255,0.6); border-radius: 4px; }

        .panel-body {
            flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .screen-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .screen-view.hidden { display: none; }

        .home-content h1 { font-size: 1.4rem; margin-bottom: 8px; font-weight: 700; }
        .home-content p { font-size: 0.84rem; opacity: 0.8; margin-bottom: 20px; line-height: 1.4; }

        .app-dock { display: flex; justify-content: space-between; gap: 14px; margin-top: auto; }
        .app-icon {
            flex: 1; height: 85px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: transform 0.1s, background 0.1s;
        }
        .app-icon span { font-size: 0.72rem; margin-top: 6px; font-weight: 600; }
        .app-icon.hovered {
            background: rgba(56, 189, 248, 0.4);
            border-color: #38bdf8; transform: scale(1.08);
        }

        /* Google Real e Apps em Iframe Interno */
        .internal-header {
            background: rgba(255, 255, 255, 0.08); padding: 12px 18px;
            display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 6px 14px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
        }
        .internal-title { font-size: 0.9rem; font-weight: 700; }
        
        .iframe-container {
            flex: 1; width: 100%; background: #fff; position: relative;
        }
        .iframe-container iframe {
            width: 100%; height: 100%; border: none;
        }

        #hand-cursor {
            position: absolute; width: 22px; height: 22px;
            background: #38bdf8; border: 3px solid #ffffff;
            border-radius: 50%; z-index: 100; pointer-events: none;
            transform: translate(-50%, -50%); display: none;
            box-shadow: 0 0 15px #38bdf8;
        }
        #hand-cursor.pinching {
            background: #4ade80; border-color: #fff;
            transform: translate(-50%, -50%) scale(0.6);
            box-shadow: 0 0 22px #4ade80;
        }

        #status {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px; border-radius: 20px; font-size: 0.75rem; z-index: 20; color: #00ff66;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
    <div id="hand-cursor"></div>

    <div class="spatial-scene">
        <div id="floating-panel">
            <div class="panel-header" id="header-drag">
                <span class="panel-title">MR SPATIAL OS</span>
                <div class="drag-bar"></div>
            </div>
            <div class="panel-body">
                
                <!-- Home Screen -->
                <div id="home-screen" class="screen-view">
                    <div class="home-content">
                        <h1>Computação Espacial</h1>
                        <p>Faz pinça na barra superior para mover o painel. Clica nos ícones abaixo para abrir o Google real ou o YouTube diretamente na tela flutuante 3D!</p>
                    </div>

                    <div class="app-dock">
                        <div class="app-icon interactive" onclick="openApp('google')">
                            <span style="font-size: 1.6rem;">🌐</span>
                            <span>Google</span>
                        </div>
                        <div class="app-icon interactive" onclick="openApp('youtube')">
                            <span style="font-size: 1.6rem;">📺</span>
                            <span>YouTube</span>
                        </div>
                    </div>
                </div>

                <!-- Google Real Screen (Google Oficial incorporado na tela flutuante) -->
                <div id="google-screen" class="screen-view hidden" style="padding: 0;">
                    <div class="internal-header">
                        <button class="back-btn interactive" onclick="goHome()">⬅ Voltar</button>
                        <span class="internal-title">Google Search (Oficial)</span>
                    </div>
                    <div class="iframe-container">
                        <!-- O parâmetro igu=1 permite carregar o Google limpo dentro de iframes -->
                        <iframe src="https://www.google.com/search?igu=1" title="Google Real"></iframe>
                    </div>
                </div>

                <!-- YouTube Screen -->
                <div id="youtube-screen" class="screen-view hidden" style="padding: 0;">
                    <div class="internal-header">
                        <button class="back-btn interactive" onclick="goHome()">⬅ Voltar</button>
                        <span class="internal-title">YouTube Player</span>
                    </div>
                    <div class="iframe-container" style="background:#000;">
                        <iframe src="https://www.youtube-nocookie.com/embed/jfKfPfyJRdk" title="YouTube" allowfullscreen></iframe>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="status">A calibrar alinhamento perfeito...</div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const cursor = document.getElementById('hand-cursor');
        const statusDiv = document.getElementById('status');
        const floatPanel = document.getElementById('floating-panel');
        const headerDrag = document.getElementById('header-drag');

        const homeScreen = document.getElementById('home-screen');
        const googleScreen = document.getElementById('google-screen');
        const youtubeScreen = document.getElementById('youtube-screen');

        function openApp(appName) {
            homeScreen.classList.add('hidden');
            googleScreen.classList.add('hidden');
            youtubeScreen.classList.add('hidden');

            if (appName === 'google') {
                googleScreen.classList.remove('hidden');
            } else if (appName === 'youtube') {
                youtubeScreen.classList.remove('hidden');
            }
        }

        function goHome() {
            googleScreen.classList.add('hidden');
            youtubeScreen.classList.add('hidden');
            homeScreen.classList.remove('hidden');
        }

        let panelX = (window.innerWidth - 390) / 2;
        let panelY = (window.innerHeight - 560) / 2;
        
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(0deg) rotateY(0deg)`;

        function onResults(results) {
            // Sincronização exata da resolução do canvas com o vídeo da câmara
            canvasElement.width = videoElement.videoWidth || 640;
            canvasElement.height = videoElement.videoHeight || 480;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Desenhar a câmara diretamente no canvas para garantir alinhamento perfeito sem desvios
            canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusDiv.innerText = "Mão Detetada [Alinhamento Perfeito & Zero Lag] 🟢";
                cursor.style.display = 'block';

                const landmarks = results.multiHandLandmarks[0];

                // Desenhar o esqueleto diretamente sobre as coordenadas nativas do canvas (alinhamento exato)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(56, 189, 248, 0.7)', lineWidth: 3});
                drawLandmarks(canvasCtx, landmarks, {color: '#38bdf8', lineWidth: 1, radius: 4});

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // Conversão direta de coordenadas normalizadas para o ecrã com object-fit: cover
                const screenCoords = getScreenCoordinates(indexTip.x, indexTip.y, canvasElement.width, canvasElement.height);
                const thumbCoords = getScreenCoordinates(thumbTip.x, thumbTip.y, canvasElement.width, canvasElement.height);

                // ZERO DELAY ABSOLUTO: Atribuição direta sem interpolação pesada
                let cursorX = screenCoords.x;
                let cursorY = screenCoords.y;

                cursor.style.left = `${cursorX}px`;
                cursor.style.top = `${cursorY}px`;

                // Inclinação 3D espacial dinâmica baseada na posição do dedo
                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;
                const tiltY = ((cursorX - centerX) / centerX) * 12;
                const tiltX = -((cursorY - centerY) / centerY) * 12;

                const pinchDist = Math.hypot(
                    (thumbCoords.x - screenCoords.x),
                    (thumbCoords.y - screenCoords.y)
                );

                const headerRect = headerDrag.getBoundingClientRect();
                const isOverHeader = (
                    cursorX >= headerRect.left && cursorX <= headerRect.right &&
                    cursorY >= headerRect.top && cursorY <= headerRect.bottom
                );

                if (pinchDist < 40) {
                    cursor.classList.add('pinching');
                    if (isOverHeader || isDragging) {
                        if (!isDragging) {
                            isDragging = true;
                            dragOffsetX = cursorX - panelX;
                            dragOffsetY = cursorY - panelY;
                            floatPanel.classList.add('dragging');
                        }
                        panelX = cursorX - dragOffsetX;
                        panelY = cursorY - dragOffsetY;
                    } else {
                        const elementUnder = document.elementFromPoint(cursorX, cursorY);
                        if (elementUnder) {
                            const clickable = elementUnder.closest('.interactive');
                            if (clickable) {
                                clickable.classList.add('hovered');
                                setTimeout(() => clickable.click(), 50);
                            }
                        }
                    }
                } else {
                    isDragging = false;
                    floatPanel.classList.remove('dragging');
                    cursor.classList.remove('pinching');
                    document.querySelectorAll('.hovered').forEach(el => el.classList.remove('hovered'));
                }

                floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

            } else {
                statusDiv.innerText = "Procurando mão no enquadramento... ✋";
                cursor.style.display = 'none';
                isDragging = false;
                floatPanel.classList.remove('dragging');
                floatPanel.style.transform = `translate3d(${panelX}px, ${panelY}px, 0px) rotateX(0deg) rotateY(0deg)`;
            }

            canvasCtx.restore();
        }

        // Função para mapear perfeitamente as coordenadas da câmara com o CSS object-fit: cover do ecrã
        function getScreenCoordinates(normX, normY, videoWidth, videoHeight) {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const videoRatio = videoWidth / videoHeight;
            const screenRatio = screenW / screenH;

            let renderW, renderH, offsetX = 0, offsetY = 0;

            if (screenRatio > videoRatio) {
                renderW = screenW;
                renderH = screenW / videoRatio;
                offsetY = (screenH - renderH) / 2;
            } else {
                renderH = screenH;
                renderW = screenH * videoRatio;
                offsetX = (screenW - renderW) / 2;
            }

            return {
                x: offsetX + (normX * renderW),
                y: offsetY + (normY * renderH)
            };
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 0,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });

        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480,
            facingMode: 'environment'
        });

        camera.start().catch(err => {
            statusDiv.innerText = "Erro ao carregar câmara!";
            console.error(err);
        });
    </script>
</body>
</html>
